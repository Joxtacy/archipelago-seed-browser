name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run pytest
      - name: Build apworld
        run: ./scripts/build_apworld.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Any tag containing a hyphen (e.g. v1.0.0-rc1, v0.2.0-list) is a
          # prerelease; bare semver tags (e.g. v1.0.0) are stable.
          if [[ "$TAG" == *-* ]]; then
            FLAGS="--prerelease"
          else
            FLAGS=""
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $FLAGS \
            dist/seed_browser.apworld
